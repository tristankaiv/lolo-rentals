<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f6f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Our homes">
<title>Lower Lonsdale homes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--paper:#f6f6f4;--card:#ffffff;--ink:#121212;--muted:#6b6b6b;--line:rgba(0,0,0,.08);--accent:#b4452a;--accent-soft:#f6e3dc;--green:#2f5a45;--green-bg:#e8f1e9;--amber:#86601d;--amber-bg:#fbefd8;--serif:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;--tabs:64px;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font:15px/1.45 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:-.006em;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--tabs) + var(--safe))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top */
.top{position:sticky;top:0;z-index:40;background:rgba(246,246,244,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 0}
.top-row{display:flex;align-items:center;gap:10px}
.top h1{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1;margin:0;letter-spacing:-.5px;flex:1}
.top h1 small{display:block;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:12px;color:var(--muted);letter-spacing:0;margin-top:4px}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--card)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 12px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:550;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.sort{display:flex;align-items:center;gap:6px;color:var(--muted)}
.chip.sort select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font:inherit;font-weight:600;color:var(--ink);padding:0}

/* hint */
.hint{margin:14px 16px 0;padding:14px 16px;border-radius:16px;background:var(--accent-soft);color:#5d2a1d;display:flex;gap:12px;align-items:flex-start;font-size:14px}
.hint b{display:block;font-size:15px;margin-bottom:3px;color:#3e1a10}
.hint button{margin-left:auto;font-weight:650;color:var(--accent);min-height:44px;padding:0 4px}

/* list */
.count{padding:14px 18px 6px;font-size:13px;color:var(--muted)}
.count b{color:var(--ink)}
.list{display:grid;gap:18px;padding:6px 14px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 4px 18px rgba(45,34,24,.05)}
.card.out{background:#f6f2ea}
.gal{position:relative;aspect-ratio:4/3;background:linear-gradient(135deg,#e6dacb,#efe6d8 50%,#cfd2c1)}
.track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.track img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center;scroll-snap-stop:always;background:#e9e1d4}
.nophoto{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#6c6253;padding:20px}
.nophoto strong{display:block;font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.1}
.nophoto small{font-size:11px;letter-spacing:1.4px;text-transform:uppercase}
.gal:after{content:'';position:absolute;inset:55% 0 0;background:linear-gradient(transparent,rgba(20,16,10,.62));pointer-events:none}
.heart{position:absolute;top:12px;right:12px;z-index:3;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.96);display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.heart svg{width:24px;height:24px}
.heart[aria-pressed=true]{color:var(--accent)}
.heart[aria-pressed=true] svg{fill:currentColor}
.heart.pop{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.25)}}
.pcount{position:absolute;top:14px;left:12px;z-index:3;background:rgba(20,16,10,.55);color:#fff;font-size:12px;font-weight:600;padding:4px 9px;border-radius:12px;pointer-events:none}
.onphoto{position:absolute;left:16px;right:16px;bottom:13px;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;color:#fff;pointer-events:none}
.onphoto b{font-size:28px;letter-spacing:-.6px;line-height:1}
.onphoto b small{font-size:13px;font-weight:500;opacity:.9}
.onphoto span{font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;text-align:right}
.onphoto svg{width:17px;height:17px}
.cbody{display:block;width:100%;text-align:left;padding:15px 16px 16px}
.cbody h3{font-family:var(--serif);font-weight:400;font-size:27px;line-height:1.08;margin:0;letter-spacing:-.3px}
.headline{margin:6px 0 0;font-size:15px;color:#3d3830}
.specs{margin:8px 0 0;font-size:13.5px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:12px;font-weight:600;padding:4px 9px;border-radius:8px;background:var(--amber-bg);color:var(--amber)}
.tag.ok{background:var(--green-bg);color:var(--green)}
.tag.out{background:#ece7de;color:#655d51}
.more{display:flex;align-items:center;gap:4px;margin-top:12px;font-size:14px;font-weight:650;color:var(--accent)}
.divider{font-family:var(--serif);font-size:26px;color:#7d7264;padding:16px 6px 0;line-height:1.1}
.divider small{display:block;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:13px;color:var(--muted);margin-top:4px}
.fb{margin:6px 14px 0;padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.fb h4{margin:0;font-family:var(--serif);font-weight:400;font-size:24px}
.fb p{margin:6px 0 8px;color:var(--muted);font-size:13px}
.fb a{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);text-decoration:none;min-height:48px}
.fb a b{min-width:66px}
.fb a span{flex:1;color:var(--muted);font-size:13px}
.fb a em{font-style:normal;color:var(--accent);font-weight:650;font-size:13px}
.empty{text-align:center;padding:50px 24px;color:var(--muted)}
.empty h2{font-family:var(--serif);font-weight:400;font-size:30px;color:var(--ink);margin:10px 0 6px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:14px;font-weight:650;font-size:16px}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{border:1px solid var(--line);background:var(--card)}

/* map */
.mapview{position:fixed;left:0;right:0;top:var(--top-h,120px);bottom:calc(var(--tabs) + var(--safe));z-index:5}
#mapbox{position:absolute;inset:0;background:#e9ece5}
.pin{display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 11px;border-radius:17px;background:var(--card);border:1.5px solid #c9c9bd;color:var(--green);font-weight:750;font-size:13px;box-shadow:0 2px 8px rgba(30,25,15,.18);white-space:nowrap;transform:translate(-50%,-50%)}
.pin.amber{color:var(--amber);background:#fff8ec;border-color:#dcc7a3}
.pin.grey{color:#5f5a52;background:#f4f1ec}
.pin.out{opacity:.7;border-style:dashed}
.pin.saved{border-color:var(--accent);box-shadow:0 0 0 3px rgba(180,69,42,.2)}
.pin.sel{background:var(--ink);color:#fff;border-color:var(--ink);transform:translate(-50%,-50%) scale(1.12)}
.pin svg{width:12px;height:12px;fill:var(--accent);stroke:var(--accent)}
.pin .short{display:none}
.far .pin{height:26px;padding:0 7px;font-size:11.5px;border-width:1px}
.far .pin .full{display:none}
.far .pin .short{display:inline}
.far .pin.sel .full{display:inline}
.far .pin.sel .short{display:none}
.far .landmark{font-size:9.5px}
.pin-icon{background:none;border:0}
.landmark{font-size:11px;font-weight:700;color:#6f5a3f;white-space:nowrap;text-shadow:0 0 4px #fff,0 0 4px #fff;transform:translate(-50%,-50%)}
.preview{position:absolute;left:12px;right:12px;bottom:12px;z-index:500;background:var(--card);border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.18);display:flex;gap:12px;padding:10px;align-items:center;text-align:left;width:calc(100% - 24px)}
.preview img,.preview .ph{width:96px;height:80px;border-radius:12px;object-fit:cover;background:#e6dacb;flex-shrink:0}
.preview b{font-size:20px}
.preview h3{font-family:var(--serif);font-weight:400;font-size:21px;margin:2px 0;line-height:1.1}
.preview p{margin:0;font-size:12.5px;color:var(--muted)}
.leaflet-control-attribution{font-size:9px!important}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:60;height:calc(var(--tabs) + var(--safe));padding-bottom:var(--safe);display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-selected=true]{color:var(--accent)}
.badge{position:relative}
.badge i{position:absolute;top:-6px;right:-12px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--accent);color:#fff;font-size:11px;font-style:normal;display:grid;place-items:center}

/* sheet */
.sheet{position:fixed;inset:0;z-index:80;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.sheet.open{transform:none}
.sheet-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:linear-gradient(rgba(246,246,244,.97),rgba(246,246,244,.9))}
.sheet-bar .back{display:flex;align-items:center;gap:4px;font-weight:650;min-height:44px;padding:0 6px;color:var(--accent)}
.sheet .gal{aspect-ratio:4/3;border-radius:0}
.sheet .gal:after{display:none}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding:8px 14px 0;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumbs button{flex:0 0 64px;height:48px;border-radius:8px;overflow:hidden;opacity:.6;border:2px solid transparent}
.thumbs button.on{opacity:1;border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.d{padding:16px 18px 120px}
.d .price{font-size:32px;font-weight:750;letter-spacing:-.8px}
.d .price small{font-size:14px;color:var(--muted);font-weight:500;letter-spacing:0}
.d h2{font-family:var(--serif);font-weight:400;font-size:36px;line-height:1.03;margin:4px 0 4px;letter-spacing:-.6px}
.d .sub{color:var(--muted);font-size:14px;margin:0}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:18px 0}
.facts div{background:var(--card);padding:12px 8px;text-align:center;font-size:18px;font-weight:650}
.facts small{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-top:2px}
.box{border-radius:16px;padding:14px 16px;margin:12px 0}
.box h4{margin:0 0 6px;font-size:13px;letter-spacing:1px;text-transform:uppercase}
.box ul{margin:0;padding-left:20px}
.box li{margin:5px 0}
.box.good{background:var(--green-bg);color:#1f3d2f}
.box.watch{background:var(--amber-bg);color:#5c410f}
.sec{border-top:1px solid var(--line);margin-top:20px;padding-top:16px}
.sec h3{font-family:var(--serif);font-weight:400;font-size:26px;margin:0 0 10px}
.amen{display:flex;flex-wrap:wrap;gap:7px}
.amen span{border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:13.5px;background:var(--card)}
.src{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;padding:0 16px;margin:8px 0;border-radius:14px;background:var(--card);border:1px solid var(--line);text-decoration:none;font-weight:650}
.src small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
details.full summary{min-height:44px;display:flex;align-items:center;font-weight:650;color:var(--accent);cursor:pointer}
details.full p{white-space:pre-line;color:#4c463e;font-size:14px}
.sheet-foot{position:fixed;left:0;right:0;bottom:0;z-index:85;padding:10px 16px calc(10px + var(--safe));background:rgba(246,246,244,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;gap:10px;transform:translateY(110%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet-foot.open{transform:none}
.sheet-foot .btn{flex:1}
.sheet-foot .btn.saved{background:var(--green);}

/* viewer */
.viewer{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column}
.viewer .track{flex:1}
.viewer .track img{object-fit:contain;background:#000}
.viewer header{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;color:#fff}
.viewer header button{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center}

/* small dialogs */
.modal{position:fixed;inset:0;z-index:120;background:rgba(30,24,18,.4);display:flex;align-items:flex-end;justify-content:center}
.modal-box{background:var(--paper);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 20px calc(20px + var(--safe));max-height:88vh;overflow:auto}
.modal-box h2{font-family:var(--serif);font-weight:400;font-size:30px;margin:0 0 6px}
.modal-box p,.modal-box li{color:#4c463e;font-size:14.5px}
.names{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.name-in{width:100%;height:50px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:17px;background:var(--card);margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(var(--tabs) + var(--safe) + 14px);transform:translateX(-50%);z-index:130;background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;max-width:calc(100vw - 32px);text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.picks-actions{display:grid;gap:10px;padding:4px 14px 10px}
.prow{display:flex;gap:12px;align-items:center;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:left;width:100%}
.prow img,.prow .ph{width:88px;height:70px;border-radius:10px;object-fit:cover;background:#e6dacb;flex-shrink:0}
.prow h3{font-family:var(--serif);font-weight:400;font-size:21px;margin:0;line-height:1.1}
.prow p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.prow b{font-size:16px}

/* family */
.round.me{font-weight:750;font-size:15px;color:#fff;border:0}
.av{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;color:#fff;font-size:12px;font-weight:750;flex-shrink:0;position:relative}
.av i{position:absolute;right:-5px;bottom:-4px;width:15px;height:15px;border-radius:50%;background:#fff;display:grid;place-items:center;font-style:normal;font-size:9px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.av.off{opacity:.28}
.fam{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--muted)}
.fam .avs{display:flex;gap:9px}
.fam .notes-n{display:flex;align-items:center;gap:4px;margin-left:auto}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1}
.seg button{min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed=true][data-react=love]{background:var(--accent);border-color:var(--accent);color:#fff}
.seg button[aria-pressed=true][data-react=maybe]{background:var(--amber);border-color:var(--amber);color:#fff}
.seg button[aria-pressed=true][data-react=no]{background:#5f5a52;border-color:#5f5a52;color:#fff}
.who-row{display:flex;flex-direction:column;gap:8px;margin:10px 0 4px}
.who-row div{display:flex;align-items:center;gap:10px;font-size:14.5px}
.note{display:flex;gap:10px;margin:12px 0}
.note .bubble{background:var(--card);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:9px 12px;font-size:14.5px;flex:1}
.note .bubble small{display:block;color:var(--muted);font-size:11.5px;margin-bottom:2px}
.note-form{display:flex;gap:8px;margin-top:10px}
.note-form textarea{flex:1;min-height:48px;max-height:140px;border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:16px;background:var(--card);resize:vertical}
.note-form button{width:52px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center}
.tag.new{background:#e3ecf8;color:#2b4d7d}
.card.gone{opacity:.55}
.card.gone .gal{filter:grayscale(1)}
.maptoggle{position:absolute;top:12px;left:12px;z-index:500;height:40px;padding:0 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13.5px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.maptoggle[aria-pressed=true]{background:var(--ink);color:#fff}
.sat .pin{box-shadow:0 2px 10px rgba(0,0,0,.45)}
.sat .landmark{color:#fff;text-shadow:0 0 4px #000,0 0 4px #000}
.feed{margin:4px 14px 6px;padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.feed h4{margin:0 0 6px;font-family:var(--serif);font-weight:400;font-size:24px}
.feed div{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.feed div:first-of-type{border-top:0}
.feed div > span:not(.av){flex:1}
.feed .av{flex:0 0 26px}
.feed small{color:var(--muted);font-size:12px}
.group-h{font-family:var(--serif);font-size:24px;padding:14px 18px 2px;color:#5d554a}
.sync{font-size:12px;color:var(--muted);padding:0 18px 8px}
.whoami{display:grid;gap:10px;margin:14px 0 6px}
.whoami button{min-height:60px;border-radius:16px;font-size:18px;font-weight:700;color:#fff}

/* clean sans headings */
.top h1,.cbody h3,.d h2,.sec h3,.modal-box h2,.prow h3,.feed h4,.fb h4,.empty h2,.preview h3,.divider,.group-h,.nophoto strong{font-weight:700!important;letter-spacing:-.022em!important}
.top h1{font-size:22px!important}
.top h1 small{font-weight:500;letter-spacing:0}
.cbody h3{font-size:19px!important;line-height:1.2!important}
.d h2{font-size:25px!important;line-height:1.15!important}
.sec h3{font-size:18px!important}
.modal-box h2{font-size:23px!important}
.prow h3{font-size:16px!important;line-height:1.25!important}
.feed h4,.fb h4{font-size:17px!important}
.divider{font-size:19px!important;color:#3a3a3a!important}
.group-h{font-size:17px!important;color:#3a3a3a!important}
.preview h3{font-size:16px!important}
.nophoto strong{font-size:19px!important}
.card{border-radius:18px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05)}
.chip{font-weight:600;font-size:13.5px}
.headline{color:#333}
.tag{font-weight:600;border-radius:7px}
.onphoto b{font-weight:800}
.d .price{font-weight:800}

const when = iso => { const d = new Date(iso), m = (Date.now() - d) / 6e4; return m < 1 ? 'just now' : m < 60 ? Math.round(m) + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : d.toLocaleDateString('en-CA', { month: 'short', day: 'numeric' }); };

const med = (() => { const v = DATA.units.map(psf).filter(Boolean).sort((a, b) => a - b); return v[Math.floor(v.length / 2)] || 3.5; })();
const clamp = n => Math.max(0, Math.min(1, n));
const score = new Map(DATA.units.map(u => [u.id,
  .35 * (psf(u) ? clamp(.5 + (med - psf(u)) / med) : .5) + .30 * clamp(1 - walkMin(u) / 25) +
  .25 * (.5 * clamp((u.sqft || 800) / 1200) + .3 * clamp(u.baths / 2) + .2 * clamp(u.amen.length / 8)) + .10 * clamp(u.sources.length / 3)]));

const FILTERS = [
  { id: 'loved', label: '♥ Loved by someone', fn: u => lovers(u.id).length > 0 },
  { id: 'unrated', label: 'I haven’t rated', fn: u => !val(u.id) },
  { id: 'budget', label: 'Under $3,200', fn: u => u.price <= 3200 },
  { id: 'baths', label: '2 baths', fn: u => u.baths >= 2 },
  { id: 'near', label: '10 min to the water', fn: u => walkMin(u) <= 10 },
  { id: 'laundry', label: 'In-suite laundry', fn: u => u.amen.includes('In-suite laundry') },
  { id: 'pets', label: 'Pets ok', fn: u => u.amen.includes('Pets ok') },
  { id: 'unfurn', label: 'Unfurnished', fn: u => !u.amen.includes('Furnished') },
  { id: 'area', label: 'My area only', fn: u => u.in_area !== false },
];
const SORTS = { rec: ['Best match', (a, b) => score.get(b.id) - score.get(a.id)], loved: ['Most loved', (a, b) => lovers(b.id).length - lovers(a.id).length || score.get(b.id) - score.get(a.id)], price: ['Lowest price', (a, b) => a.price - b.price], walk: ['Closest to water', (a, b) => walkMin(a) - walkMin(b)], size: ['Biggest', (a, b) => (b.sqft || 0) - (a.sqft || 0)], new: ['Newest', (a, b) => (b.first_seen || '').localeCompare(a.first_seen || '')] };
const S = { on: new Set(), sort: 'rec', view: 'homes', sel: null };
const bucket = u => gone(u) ? 3 : val(u.id) === 'no' ? 2 : u.in_area === false ? 1 : 0;

function visible() {
  return DATA.units.filter(u => [...S.on].every(id => FILTERS.find(f => f.id === id).fn(u)))
    .sort((a, b) => (bucket(a) - bucket(b)) || SORTS[S.sort][1](a, b) || a.price - b.price);
}
function chips() {
  $('#chips').innerHTML = `<label class="chip sort">Sort <select id="sort" aria-label="Sort homes">${Object.entries(SORTS).map(([k, [l]]) => `<option value="${k}"${k === S.sort ? ' selected' : ''}>${l}</option>`).join('')}</select></label>` +
    FILTERS.map(f => `<button class="chip" data-filter="${f.id}" aria-pressed="${S.on.has(f.id)}">${f.label}</button>`).join('');
  $('#sort').onchange = e => { S.sort = e.target.value; renderHomes(); scrollTo({ top: 0 }); };
}

const av = (pid, mark) => `<span class="av${mark === undefined ? '' : mark ? '' : ' off'}" style="background:${P[pid].c}" title="${P[pid].n}${mark ? ': ' + REACT[mark][1] : ''}">${P[pid].n[0]}${mark ? `<i style="color:${mark === 'love' ? 'var(--accent)' : mark === 'maybe' ? 'var(--amber)' : '#555'}">${REACT[mark][0]}</i>` : ''}</span>`;
function famRow(u) {
  const n = notes(u.id).length;
  return `<div class="fam"><span class="avs">${PEOPLE.map(p => av(p.id, val(u.id, p.id) || null)).join('')}</span>${n ? `<span class="notes-n">${ic('chat')}${n} note${n === 1 ? '' : 's'}</span>` : ''}</div>`;
}
function gallery(u, big) {
  const ph = photos(u);
  if (!ph.length) return `<div class="gal"><div class="nophoto"><div><strong>${esc(u.addr)}</strong><small>No photos in the listing</small></div></div>${heartBtn(u)}${big ? '' : onPhoto(u)}</div>`;
  return `<div class="gal"><div class="track" data-gal="${u.id}">${ph.map((p, i) => `<img src="${esc(big ? p : small(p))}" alt="Photo ${i + 1} of ${ph.length}, ${esc(u.addr)}" loading="${i < 1 ? 'eager' : 'lazy'}" decoding="async" data-view="${u.id}" data-i="${i}" onerror="this.remove()">`).join('')}</div>${ph.length > 1 ? `<span class="pcount" data-pc="${u.id}">1 / ${ph.length}</span>` : ''}${heartBtn(u)}${big ? '' : onPhoto(u)}</div>`;
}
const heartBtn = u => `<button class="heart" data-react="love" data-home="${u.id}" aria-pressed="${val(u.id) === 'love'}" aria-label="${val(u.id) === 'love' ? 'Remove your love' : 'Love this home'}">${ic('heart')}</button>`;
const onPhoto = u => `<div class="onphoto"><b>${money(u.price)}<small> /mo</small></b><span>${ic('walk')}${walkMin(u)} min to<br>the water</span></div>`;
const specs = u => `${u.beds} bed · ${u.baths} bath${u.baths === 1 ? '' : 's'}${u.sqft ? ' · ' + u.sqft.toLocaleString('en-CA') + ' sq ft' : ''}${u.unit ? ' · Unit ' + esc(u.unit) : ''}`;
function tags(u, all) {
  const t = [];
  if (gone(u)) t.push(`<span class="tag out">No longer listed${u.last_seen ? ' · since ' + new Date(u.last_seen).toLocaleDateString('en-CA', { month: 'short', day: 'numeric' }) : ''}</span>`);
  if (isNew(u)) t.push(`<span class="tag new">New</span>`);
  if (u.in_area === false) t.push(`<span class="tag out">Outside your area · ${esc(u.area_note || 'further up')}</span>`);
  (u.flags || []).forEach(f => t.push(`<span class="tag">${esc(f)}</span>`));
  if (all && u.verified === 'live' && !gone(u)) t.push(`<span class="tag ok">Still listed ${esc(u.verified_on || '')}</span>`);
  if (u.approx) t.push(`<span class="tag out">Exact address not given</span>`);
  return t.length ? `<div class="tags">${(all ? t : t.slice(0, 3)).join('')}</div>` : '';
}
function card(u) {
  return `<article class="card${u.in_area === false ? ' out' : ''}${gone(u) ? ' gone' : ''}" id="c-${u.id}">${gallery(u)}<button class="cbody" data-open="${u.id}"><h3>${esc(u.addr)}</h3>${u.hl?.headline ? `<p class="headline">${esc(u.hl.headline)}</p>` : ''}<p class="specs">${specs(u)}</p>${tags(u)}${famRow(u)}</button></article>`;
}
const HEADS = ['', '<div class="divider">A little further up<small>Outside the area you marked, kept to compare</small></div>', '<div class="divider">Said no to<small>Homes you marked No</small></div>', '<div class="divider">No longer listed<small>Taken down by the landlord or agent</small></div>'];
function renderHomes() {
  const v = visible(); let html = '', last = 0;
  v.forEach(u => { const b = bucket(u); if (b !== last && b > 0) { html += HEADS[b]; last = b; } html += card(u); });
  const inArea = v.filter(u => bucket(u) === 0).length;
  $('#count').innerHTML = v.length ? `<b>${v.length} home${v.length === 1 ? '' : 's'}</b>${S.on.size ? ' match' : ''} · ${inArea} in your area` : '';
  $('#list').innerHTML = v.length ? html : `<div class="empty">${ic('home')}<h2>Nothing matches all of those.</h2><p>Try turning one filter off.</p><button class="btn ghost" data-clear>Show all homes</button></div>`;
  $$('[data-filter]').forEach(b => b.setAttribute('aria-pressed', S.on.has(b.dataset.filter)));
  renderFb(); if (map) drawPins();
}
function renderFb() {
  const fb = (DATA.unmapped || []).filter(f => f.status !== 'gone');
  $('#fbBox').innerHTML = fb.length && !S.on.size ? `<div class="fb"><h4>Also on Facebook</h4><p>Facebook doesn’t show street addresses or let us copy photos. Tap one to see it there.</p>${fb.map(f => `<a href="${esc(f.url)}" target="_blank" rel="noopener"><b>${money(f.price)}</b><span>2 bed · ${f.baths} bath${f.note ? ' · ' + esc(f.note) : ''}${f.dup ? ' · probably ' + esc(f.dup) + ' above' : ''}</span><em>Open ›</em></a>`).join('')}</div>` : '';
}

function renderPicks() {
  const units = DATA.units.filter(u => !gone(u));
  const all3 = units.filter(u => lovers(u.id).length === PEOPLE.length);
  const some = units.filter(u => lovers(u.id).length && lovers(u.id).length < PEOPLE.length).sort((a, b) => lovers(b.id).length - lovers(a.id).length);
  const maybe = units.filter(u => !lovers(u.id).length && PEOPLE.some(p => val(u.id, p.id) === 'maybe'));
  const row = u => { const p = photos(u)[0]; return `<button class="prow" data-open="${u.id}">${p ? `<img src="${esc(small(p))}" alt="" loading="lazy">` : '<span class="ph"></span>'}<span style="flex:1"><h3>${esc(u.addr)}</h3><b>${money(u.price)}</b><p>${u.beds} bed · ${u.baths} bath · ${walkMin(u)} min to the water</p>${famRow(u)}</span></button>`; };
  const group = (t, l) => l.length ? `<div class="group-h">${t}</div><div class="list">${l.map(row).join('')}</div>` : '';
  const feed = [];
  RX.forEach((o, h) => Object.entries(o).forEach(([p, v]) => feed.push({ p, h, at: null, txt: `${REACT[v][1].toLowerCase() === 'no' ? 'said no to' : REACT[v][1].toLowerCase() === 'love' ? 'loves' : 'is a maybe on'}` })));
  const nfeed = []; CM.forEach((l, h) => l.forEach(c => nfeed.push({ p: c.person, h, at: c.at, txt: `: “${c.body.length > 70 ? c.body.slice(0, 70) + '…' : c.body}”` })));
  nfeed.sort((a, b) => b.at.localeCompare(a.at));
  $('#picksCount').innerHTML = `<div class="sync">${LIVE ? (syncErr ? 'Offline. Showing the last saved picks.' : 'Shared live between Tristan, Mom and Sister' + (lastSync ? ' · updated ' + when(lastSync.toISOString()) : '')) : 'Saved on this phone only (sharing switches on soon)'}</div>`;
  $('#picksActions').innerHTML = nfeed.length ? `<div class="feed"><h4>Latest notes</h4>${nfeed.slice(0, 6).map(f => `<div>${av(f.p)}<span><b>${P[f.p]?.n || ''}</b> on <button data-open="${f.h}" style="text-decoration:underline">${esc(byId.get(f.h)?.addr || '')}</button>${esc(f.txt)}</span><small>${when(f.at)}</small></div>`).join('')}</div>` : '';
  $('#picksList').outerHTML = `<div id="picksList">${group('Everyone loves', all3) + group('Loved by some', some) + group('Maybes', maybe) || `<div class="empty">${ic('heart')}<h2>No picks yet.</h2><p>Open a home and tap Love, Maybe or No. Everyone’s picks show up here.</p><button class="btn ghost" data-go="homes">Look at homes</button></div>`}${!LIVE && units.some(u => val(u.id) === 'love') ? `<div class="picks-actions"><button class="btn primary" id="sendPicks">${ic('send')}Send my picks</button></div>` : ''}</div>`;
  const n = units.filter(u => lovers(u.id).length).length; $('#tabCount').textContent = n; $('#tabCount').hidden = !n;
}

function refresh() {
  renderHomes(); renderPicks();
  const ta = $('#noteIn'), typing = ta && (ta.value || document.activeElement === ta);
  if (S.sel && !typing) { const sc = $('#sheet').scrollTop; openHome(S.sel, false, true); $('#sheet').scrollTop = sc; }
  else if (S.sel) foot(byId.get(S.sel));
  const meb = $('#meBtn'); if (me) { meb.textContent = P[me].n[0]; meb.style.background = P[me].c; meb.setAttribute('aria-label', 'You are ' + P[me].n + '. Tap to switch'); } else { meb.textContent = '?'; meb.style.background = '#8a8378'; }
  if (map) drawPins();
}

// detail sheet
function openHome(id, push = true, keep = false) {
  const u = byId.get(id); if (!u) return; S.sel = id;
  const hl = u.hl || {}, ph = photos(u);
  const facts = [[u.beds, 'bedrooms'], [u.baths, 'bathrooms'], [u.sqft ? u.sqft.toLocaleString('en-CA') : '—', 'sq ft'], [walkMin(u) + ' min', 'to the water'], [(u.walk_quay_min ?? '—') + ' min', 'to Lonsdale Quay'], [psf(u) ? '$' + psf(u).toFixed(2) : '—', 'per sq ft']];
  const prevGal = keep && $('#sheet [data-gal]') ? $('#sheet [data-gal]').scrollLeft : 0;
  $('#sheet').innerHTML = `<div class="sheet-bar"><button class="back" data-close>${ic('back')}All homes</button>${ph.length ? `<button class="round" data-viewer="${u.id}" aria-label="Full-screen photos">${ic('expand')}</button>` : ''}</div>
  ${gallery(u, true)}${ph.length > 1 ? `<div class="thumbs">${ph.map((p, i) => `<button data-jump="${i}" class="${i ? '' : 'on'}" aria-label="Photo ${i + 1}"><img src="${esc(small(p))}" alt="" loading="lazy"></button>`).join('')}</div>` : ''}
  <div class="d"><div class="price">${money(u.price)} <small>a month</small></div><h2>${esc(u.addr)}</h2><p class="sub">${u.unit ? 'Unit ' + esc(u.unit) + ' · ' : ''}North Vancouver${u.lease ? ' · Lease: ' + esc(u.lease) : ''}</p>${tags(u, true)}
  ${hl.headline ? `<p class="headline" style="font-size:17px;margin-top:14px">${esc(hl.headline)}</p>` : ''}
  <div class="sec"><h3>What everyone thinks</h3><div class="who-row">${PEOPLE.map(p => `<div>${av(p.id, val(u.id, p.id) || null)}<span><b>${p.n}</b> ${val(u.id, p.id) ? '· ' + REACT[val(u.id, p.id)][1] : '<span style="color:var(--muted)">· not yet</span>'}</span></div>`).join('')}</div></div>
  <div class="facts">${facts.map(([v, l]) => `<div>${esc(v)}<small>${l}</small></div>`).join('')}</div>
  ${hl.good?.length ? `<div class="box good"><h4>Why you might like it</h4><ul>${hl.good.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
  ${hl.watch?.length ? `<div class="box watch"><h4>Worth checking</h4><ul>${hl.watch.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
  <div class="sec"><h3>Notes</h3>${notes(u.id).map(c => `<div class="note">${av(c.person)}<div class="bubble"><small>${P[c.person]?.n || ''} · ${when(c.at)}</small>${esc(c.body)}</div></div>`).join('') || '<p class="sub">No notes yet. Ask a question or say what you think.</p>'}
  <form class="note-form" data-note="${u.id}"><textarea id="noteIn" placeholder="Write a note for the family…" aria-label="Write a note"></textarea><button type="submit" aria-label="Send note">${ic('send')}</button></form></div>
  ${u.amen.length ? `<div class="sec"><h3>What it has</h3><div class="amen">${u.amen.map(a => `<span>${esc(a)}</span>`).join('')}</div></div>` : ''}
  <div class="sec"><h3>See the listing</h3>${u.sources.map(s => `<a class="src" href="${esc(s.url)}" target="_blank" rel="noopener"><span>${esc(s.src)}<small>${money(s.price)} a month${s.src === 'Craigslist' || s.src === 'liv.rent' ? ' · message the landlord there' : ' · contact the agent there'}</small></span>${ic('out')}</a>`).join('')}
  <p class="sub" style="margin-top:8px">${u.broker ? 'Agent: ' + esc(u.broker) + '. ' : ''}Prices and availability change, so confirm with the listing before a viewing.</p></div>
  ${u.desc ? `<details class="full sec"><summary>Read the full listing text</summary><p>${esc(u.desc)}</p></details>` : ''}
  <div class="sec"><button class="btn ghost" data-showmap="${u.id}" style="width:100%">${ic('map')}Show on the map</button></div></div>`;
  if (prevGal) $('#sheet [data-gal]').scrollLeft = prevGal;
  $('#sheet').classList.add('open'); if (!keep) $('#sheet').scrollTop = 0; foot(u);
  document.body.style.overflow = 'hidden';
  if (push) history.pushState({ home: id }, '', '#' + id);
}
function foot(u) {
  $('#sheetFoot').innerHTML = `<div class="seg">${Object.entries(REACT).map(([k, [s, l]]) => `<button data-react="${k}" data-home="${u.id}" aria-pressed="${val(u.id) === k}">${s} ${l}</button>`).join('')}</div>`;
  $('#sheetFoot').classList.add('open');
}
function closeHome(pop) {
  if (!$('#sheet').classList.contains('open')) return;
  $('#sheet').classList.remove('open'); $('#sheetFoot').classList.remove('open'); document.body.style.overflow = ''; S.sel = null;
  if (!pop && location.hash) history.back();
}
function openViewer(id, start = 0) {
  const u = byId.get(id), ph = photos(u); if (!ph.length) return;
  $('#viewer').innerHTML = `<header><span data-vc>${start + 1} / ${ph.length}</span><button data-vclose aria-label="Close photos">${ic('close')}</button></header><div class="track" data-vtrack>${ph.map((p, i) => `<img src="${esc(p)}" alt="Photo ${i + 1}" loading="${Math.abs(i - start) < 2 ? 'eager' : 'lazy'}">`).join('')}</div>`;
  $('#viewer').hidden = false; const t = $('[data-vtrack]'); requestAnimationFrame(() => { t.scrollLeft = start * t.clientWidth; });
}

// map with a satellite option
let map = null, layer = null, base = {}, sat = false;
function initMap() {
  if (map || !window.L) return;
  map = L.map('mapbox', { zoomControl: false, attributionControl: true }).setView(DATA.meta.center, 15.5);
  L.control.zoom({ position: 'topright' }).addTo(map); map.attributionControl.setPrefix(false);
  const esri = p => `https://services.arcgisonline.com/ArcGIS/rest/services/${p}/MapServer/tile/{z}/{y}/{x}`;
  base.map = L.layerGroup([L.tileLayer(esri('Canvas/World_Light_Gray_Base'), { maxZoom: 19, maxNativeZoom: 16, attribution: 'Tiles © Esri · © OpenStreetMap contributors' }), L.tileLayer(esri('Canvas/World_Light_Gray_Reference'), { maxZoom: 19, maxNativeZoom: 16, pane: 'overlayPane' })]);
  base.sat = L.layerGroup([L.tileLayer(esri('World_Imagery'), { maxZoom: 19, maxNativeZoom: 19, attribution: 'Imagery © Esri, Maxar, Earthstar Geographics' }), L.tileLayer(esri('Reference/World_Transportation'), { maxZoom: 19, pane: 'overlayPane', opacity: .7 }), L.tileLayer(esri('Reference/World_Boundaries_and_Places'), { maxZoom: 19, pane: 'overlayPane' })]);
  base.map.addTo(map);
  [[DATA.meta.shipyards, 'The Shipyards'], [DATA.meta.quay, 'Lonsdale Quay']].forEach(([p, n]) => L.marker(p, { icon: L.divIcon({ className: 'pin-icon', html: `<div class="landmark">⚓ ${n}</div>` }), interactive: false }).addTo(map));
  layer = L.layerGroup().addTo(map); drawPins();
  const zoomClass = () => $('#mapbox').classList.toggle('far', map.getZoom() < 16);
  map.on('zoomend', zoomClass); zoomClass();
  if (window.ResizeObserver) new ResizeObserver(() => map.invalidateSize()).observe($('#mapbox'));
  map.on('click', () => { $('#preview').hidden = true; S.mapSel = null; drawPins(); });
}
function setSat(on) {
  sat = on; if (!map) return;
  map.removeLayer(on ? base.map : base.sat); (on ? base.sat : base.map).addTo(map);
  $('#mapbox').classList.toggle('sat', on); $('#satBtn').setAttribute('aria-pressed', on); $('#satBtn').textContent = on ? 'Map' : 'Satellite';
}
function drawPins() {
  if (!layer) return; layer.clearLayers();
  visible().filter(u => u.lat && u.lng && !gone(u)).forEach(u => {
    const n = lovers(u.id).length;
    const m = L.marker([u.lat, u.lng], { icon: L.divIcon({ className: 'pin-icon', html: `<div class="pin ${tier(u)}${u.in_area === false ? ' out' : ''}${n ? ' saved' : ''}${S.mapSel === u.id ? ' sel' : ''}">${n ? `<svg><use href="#heart"/></svg>${n > 1 ? n : ''}` : ''}<span class="full">${money(u.price)}</span><span class="short">${(u.price / 1000).toFixed(1)}k</span></div>`, iconSize: [0, 0] }), zIndexOffset: S.mapSel === u.id ? 1000 : n * 100 - (u.in_area === false ? 100 : 0), keyboard: true, title: u.addr });
    m.on('click', e => { L.DomEvent.stopPropagation(e); pinTap(u.id); }); layer.addLayer(m);
  });
}
function pinTap(id) {
  if (matchMedia('(min-width:900px)').matches) { S.mapSel = id; drawPins(); openHome(id); document.getElementById('c-' + id)?.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
  const u = byId.get(id), p = photos(u)[0]; S.mapSel = id; drawPins();
  $('#preview').innerHTML = `${p ? `<img src="${esc(small(p))}" alt="">` : '<span class="ph"></span>'}<span><b>${money(u.price)}</b><h3>${esc(u.addr)}</h3><p>${u.beds} bed · ${u.baths} bath · ${walkMin(u)} min to the water · tap for details</p></span>`;
  $('#preview').dataset.open = id; $('#preview').hidden = false;
}
function fit() { if (!map) return; const pts = visible().filter(u => u.lat && u.in_area !== false && !gone(u)).map(u => [u.lat, u.lng]); if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 16.5 }); }
function loadLeaflet(cb) { if (window.L) return cb(); const s = document.createElement('script'); s.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'; s.onload = cb; document.head.append(s); }

function setView(v) {
  S.view = v; const desk = matchMedia('(min-width:900px)').matches;
  $$('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.view === v));
  $('#homesView').hidden = v === 'picks' || (v === 'map' && !desk);
  $('#picksView').hidden = v !== 'picks';
  $('#mapView').hidden = v !== 'map' && !desk;
  $('#chips').hidden = v === 'picks';
  if (v === 'picks') { renderPicks(); pull(); }
  if (v === 'map' || desk) loadLeaflet(() => { initMap(); setTimeout(() => { map.invalidateSize(); if (!S.fitted) { fit(); S.fitted = true; } }, 60); });
  measure(); if (!desk) scrollTo({ top: 0 });
}
function measure() { document.documentElement.style.setProperty('--top-h', $('#top').offsetHeight + 'px'); if (map) map.invalidateSize(); }

let toastT; function toast(t) { clearTimeout(toastT); $('#toast').textContent = t; $('#toast').hidden = false; toastT = setTimeout(() => $('#toast').hidden = true, 2200); }
async function copy(text, ok) { try { await navigator.clipboard.writeText(text); toast(ok); } catch { modal(`<h2>Copy this</h2><textarea class="name-in" style="height:220px;padding:12px" readonly>${esc(text)}</textarea><button class="btn ghost" data-mclose>Done</button>`); } }
function modal(html) { $('#modal').innerHTML = `<div class="modal-box">${html}</div>`; $('#modal').hidden = false; }
let afterWho = null;
function askWho(then) {
  afterWho = then || null;
  modal(`<h2>Who’s this?</h2><p>So everyone can see whose picks and notes are whose. You only pick once on this phone.</p><div class="whoami">${PEOPLE.map(p => `<button data-me="${p.id}" style="background:${p.c}">${p.n}</button>`).join('')}</div>`);
}
function picksText() {
  const list = DATA.units.filter(u => val(u.id) === 'love').sort((a, b) => score.get(b.id) - score.get(a.id));
  return `${me ? P[me].n + "'s" : 'My'} picks 🏡 Lower Lonsdale\n${location.href.split('#')[0]}\n\n` + list.map((u, i) => `${i + 1}. ${u.addr}${u.unit ? ' #' + u.unit : ''} · ${money(u.price)}/mo\n   ${u.beds} bed · ${u.baths} bath · ${walkMin(u)} min to the water\n   ${u.sources[0].url}`).join('\n\n');
}
function sendPicks() { const text = picksText(); if (navigator.share) navigator.share({ text }).catch(e => { if (e.name !== 'AbortError') copy(text, 'Copied. Paste it into a text.'); }); else copy(text, 'Copied. Paste it into a text to the family.'); }
function info() {
  const n = DATA.units.filter(u => !gone(u)).length, inA = DATA.units.filter(u => u.in_area !== false && !gone(u)).length;
  modal(`<h2>How this works</h2><ol><li><b>Swipe</b> through each home's photos. Tap a photo to see it full screen.</li><li><b>Tap a home</b> for everything about it. Mark it <b>Love</b>, <b>Maybe</b> or <b>No</b>, and leave a note.</li><li><b>Our picks</b> shows what all three of you think, and the latest notes.</li><li>The map has a <b>Satellite</b> button to see the buildings and streets.</li></ol>
  <p>${n} two-bedroom homes (${inA} in the area you marked) from Craigslist, REW, property.ca, liv.rent, Facebook Marketplace and more. The list refreshes every morning: new homes get a “New” tag, and homes that come down stay greyed out so your notes don’t disappear.${DATA.meta.updated ? ' Last refreshed ' + new Date(DATA.meta.updated).toLocaleDateString('en-CA', { month: 'long', day: 'numeric' }) + '.' : ''}</p>
  <p>Walking times follow real streets. Prices change, so always confirm with the listing before a viewing.</p><button class="btn ghost" data-mclose style="width:100%">Close</button>`);
}

document.addEventListener('click', e => {
  const t = e.target.closest('button,a,img'); if (!t) return;
  const d = t.dataset;
  if (d.react) { e.stopPropagation(); if (t.classList.contains('heart')) { t.classList.remove('pop'); void t.offsetWidth; t.classList.add('pop'); } return react(d.home, d.react); }
  if (d.open) return openHome(d.open);
  if (d.filter) { S.on.has(d.filter) ? S.on.delete(d.filter) : S.on.add(d.filter); renderHomes(); if (map) fit(); return; }
  if (d.view && t.classList.contains('tab')) return setView(d.view);
  if (d.view && t.tagName === 'IMG') return openViewer(d.view, +d.i);
  if (d.viewer) { const tr = $('#sheet [data-gal]'); return openViewer(d.viewer, tr ? Math.round(tr.scrollLeft / tr.clientWidth) : 0); }
  if (d.jump !== undefined) { const tr = $('#sheet [data-gal]'); tr.scrollTo({ left: +d.jump * tr.clientWidth, behavior: 'smooth' }); return; }
  if ('close' in d) return closeHome();
  if ('vclose' in d) { $('#viewer').hidden = true; return; }
  if ('mclose' in d) { $('#modal').hidden = true; return; }
  if ('clear' in d) { S.on.clear(); renderHomes(); return; }
  if (d.go) return setView(d.go);
  if (d.me) { me = d.me; store.set(ME, me); $('#modal').hidden = true; refresh(); toast('Hi ' + P[me].n + '!'); const f = afterWho; afterWho = null; if (f) f(); return; }
  if (d.showmap) { closeHome(); setView('map'); loadLeaflet(() => { initMap(); const u = byId.get(d.showmap); setTimeout(() => { map.setView([u.lat, u.lng], 17); pinTap(u.id); }, 120); }); return; }
  if (t.id === 'sendPicks') return sendPicks();
  if (t.id === 'preview') return openHome(t.dataset.open);
  if (t.id === 'infoBtn') return info();
  if (t.id === 'meBtn') return askWho();
  if (t.id === 'satBtn') return setSat(!sat);
  if (t.id === 'deskPicks') return setView(S.view === 'picks' ? 'homes' : 'picks');
  if (t.id === 'hintOk') { $('#hint').hidden = true; store.set(HINT, '1'); return; }
  if (t.id === 'shareBtn') { const url = location.href.split('#')[0]; if (navigator.share) navigator.share({ title: 'Lower Lonsdale homes', text: 'Homes we found near the water. Mark the ones you like and leave notes. We all see each other’s picks.', url }).catch(() => {}); else copy(url, 'Link copied.'); }
});
document.addEventListener('submit', e => { const f = e.target.closest('[data-note]'); if (!f) return; e.preventDefault(); const ta = f.querySelector('textarea'); const v = ta.value; ta.value = ''; addNote(f.dataset.note, v); });
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') $('#modal').hidden = true; });
document.addEventListener('scroll', e => {
  const tr = e.target; if (!(tr instanceof Element)) return;
  const i = Math.round(tr.scrollLeft / tr.clientWidth);
  if (tr.dataset.gal) { const n = tr.children.length; $$(`[data-pc="${tr.dataset.gal}"]`).forEach(c => { if (tr.closest('.sheet') ? c.closest('.sheet') : !c.closest('.sheet')) c.textContent = `${i + 1} / ${n}`; }); if (tr.closest('.sheet')) $$('#sheet [data-jump]').forEach((b, k) => b.classList.toggle('on', k === i)); }
  if ('vtrack' in tr.dataset) $('[data-vc]').textContent = `${i + 1} / ${tr.children.length}`;
}, { capture: true, passive: true });
addEventListener('popstate', () => { if (!location.hash) closeHome(true); else if (byId.has(location.hash.slice(1))) openHome(location.hash.slice(1), false); });
addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('#viewer').hidden) $('#viewer').hidden = true; else if (!$('#modal').hidden) $('#modal').hidden = true; else closeHome(); } });
addEventListener('resize', measure);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(); });
setInterval(() => { if (!document.hidden && LIVE) pull(); }, 20000);

// hearts saved by the earlier version become this person's Love the first time they say who they are
try { const old = JSON.parse(store.get(KEY, '[]')); if (old.length && !store.get(KEY + '-migrated', '')) { const f = afterWho; afterWho = null; const go = () => { old.filter(id => byId.has(id) && !val(id)).forEach(id => react(id, 'love')); store.set(KEY + '-migrated', '1'); }; if (me) go(); else afterWho = go; } } catch {}

const upd = DATA.meta.updated || DATA.meta.generated;
$('#sub').textContent = `${DATA.units.filter(u => !gone(u)).length} two-bed homes · updated ${new Date(upd + (upd.length === 10 ? 'T12:00' : '')).toLocaleDateString('en-CA', { month: 'short', day: 'numeric' })}`;
chips(); refresh(); pull();
if (!store.get(HINT, '')) $('#hint').hidden = false;
setView('homes');
if (!me) setTimeout(() => askWho(afterWho), 400);
if (location.hash && byId.has(location.hash.slice(1))) openHome(location.hash.slice(1), false);

</script>
</body>
</html>
